name: Bug report
description: Report a reproducible compatibility or runtime defect
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security issues, use a private GitHub security advisory instead.
  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Node.js or browser name and version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
